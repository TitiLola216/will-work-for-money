name: Remote job search

on:
  push:
    paths:
      - '.github/workflows/remote-job-search.yml'
      - 'config/lever_boards.json'
      - 'scripts/collect_lever_jobs.py'
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-job-search
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect live direct-ATS candidates
        run: python scripts/collect_lever_jobs.py
      - name: Commit tracker and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job_tracker.csv reports/latest.md
          git diff --cached --quiet || git commit -m 'Update verified job-search candidates'
          git push
